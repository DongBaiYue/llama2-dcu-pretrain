### data
dataset_type: pretrain
input_dir: "1.0 ./data/pt/llama_openwebtext_100k"
split: "990,10,0"
max_seq_len: 4096

### model
model_name_or_path: ./models/Llama-3-100b
# DCU 不支持 flashmask
_attn_implementation: eager
continue_training: false
share_folder: true

### finetuning
stage: PT
fine_tuning: full
do_train: true
do_eval: true
seed: 23
per_device_train_batch_size: 1
max_steps: 300
eval_steps: 300
evaluation_strategy: steps
eval_iters: 10
save_steps: 300
save_strategy: "no"
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./logs/pt/llama3-100b
output_dir: ./checkpoints/pt/llama3-100b
overwrite_output_dir: true

# train
warmup_steps: 10
learning_rate: 1.0e-4

# performance
tensor_model_parallel_size: 8
pipeline_model_parallel_size: 4
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
tensorwise_offload_optimizer: true
bf16: true

# device
device: gpu
