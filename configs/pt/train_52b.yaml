### Llama-2-52B 预训练配置 (4倍扩张)
### 参数量: ~52B (13B × 4)
### 架构: 80层, 7168 hidden_size (深度2倍 + 宽度约1.4倍)

### data
dataset_type: pretrain
input_dir: "1.0 ./data/pt/llama_openwebtext_100k"
split: "990,10,0"
max_seq_len: 4096

### model
model_name_or_path: ./models/Llama-2-52B
_attn_implementation: eager
continue_training: false

### finetuning
stage: PT
fine_tuning: full
do_train: true
do_eval: true
seed: 23
per_device_train_batch_size: 1
max_steps: 20
eval_steps: 100
evaluation_strategy: steps
eval_iters: 10
save_steps: 100
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./logs/pt/52b
output_dir: ./checkpoints/pt/52b
overwrite_output_dir: true

# train
warmup_steps: 10
learning_rate: 1.0e-4

# performance (52B需要16卡: 2机, TP=8, PP=2)
tensor_model_parallel_size: 8
pipeline_model_parallel_size: 2
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
tensorwise_offload_optimizer: true
bf16: true

# device
device: gpu
