### data
dataset_type: pretrain
input_dir: "1.0 ./data/pt/llama_openwebtext_100k"
split: "990,10,0"
max_seq_len: 4096

### model
model_name_or_path: ./models/Llama-3-8b
# DCU 不支持 flashmask
_attn_implementation: eager
num_hidden_layers: 4
continue_training: false
share_folder: true

### finetuning
stage: PT
fine_tuning: full
do_train: true
do_eval: false
seed: 23
per_device_train_batch_size: 1
max_steps: 20
eval_steps: 999
evaluation_strategy: "no"
eval_iters: 10
save_steps: 30
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./logs/pt/llama3-8b_mini
output_dir: ./checkpoints/pt/llama3-8b_mini
overwrite_output_dir: true

# train
warmup_steps: 10
learning_rate: 1.0e-4

# performance
tensor_model_parallel_size: 2
pipeline_model_parallel_size: 2
sharding: stage1
sharding_parallel_size: 2
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true

# checkpoint
save_total_limit: 1
save_rng_states: false
save_sharded_model: true
load_sharded_model: true
save_checkpoint_format: flex_checkpoint
load_checkpoint_format: sharding_io
save_safetensors: false

# device
device: gpu
