### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: ./data/sft/school_math_0.25M/train_llama3.json
train_dataset_prob: "1.0"
eval_dataset_path: ./data/sft/school_math_0.25M/dev_llama3.json
eval_dataset_prob: "1.0"
max_seq_len: 2048
packing: true

### model
model_name_or_path: ./models/Llama-3-8b
_attn_implementation: eager
continue_training: true

### finetuning
stage: SFT
fine_tuning: full
do_train: true
disable_tqdm: true
seed: 23
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
max_steps: 50
eval_steps: 50
evaluation_strategy: steps
eval_iters: 10
save_steps: 50
save_strategy: "no"
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./logs/sft/llama3-8b
output_dir: ./checkpoints/sft/llama3-8b
overwrite_output_dir: true

# train
warmup_steps: 5
learning_rate: 1.0e-6

# performance
tensor_model_parallel_size: 2
pipeline_model_parallel_size: 2
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true

# device
device: gpu
